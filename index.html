<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 첫 번째 아이디어 - My First Idea</title>
  <meta name="description" content="화면 중앙에 펼쳐지는 감각적이고 몰입감 있는 첫 번째 아이디어 공간입니다.">

  <!-- Font Preloading and Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- App Header (Green theme) -->
  <header class="app-header">
    <h2 class="header-title">
      <svg class="header-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <span>나의 첫 서비스</span>
    </h2>
  </header>

  <!-- Ambient Background Glows -->
  <div class="glow-container" aria-hidden="true">
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="interactive-glow" id="js-interactive-glow"></div>
  </div>

  <!-- Main Showcase Container -->
  <main class="viewport-wrapper">
    <!-- Section 1: Feature Showcase -->
    <section class="feature-section">
      <section class="card-container" id="js-card-container">
        <div class="glass-card">
          <!-- Subtitle/Badge -->
          <div class="badge-wrapper">
            <span class="pulse-dot"></span>
            <span class="badge-text">CREATIVE SPARK // NO. 01</span>
          </div>

          <!-- Main Title -->
          <h1 class="main-title">오늘도 힘내세요!!</h1>

          <!-- Subtext/Description -->
          <p class="description">
            가장 위대한 여정은 작은 생각 하나에서 시작됩니다.<br>
            당신의 영감을 현실로 만드는 첫 번째 발걸음...
          </p>

          <!-- Dynamic Action Button -->
          <div class="button-wrapper">
            <button class="interactive-btn" id="js-explore-btn">
              <span class="btn-text">시작하기</span>
              <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"
                xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
            <button class="interactive-btn next-btn theme-red" id="js-next-btn">
              <span class="btn-text">다음 문장 보기</span>
              <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"
                xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </div>
      </section>
    </section>

    <!-- Section 2: User Testimonials -->
    <section class="testimonials-section">
      <div class="testimonial-card">
        <img src="images/user1.png" class="user-avatar" alt="김민수 프로필">
        <div class="testimonial-content">
          <p class="testimonial-text">"이 서비스를 사용한 뒤로 아침마다 긍정적인 힘을 얻고 있습니다. 문구 교체 효과가 정말 세련되었네요!"</p>
          <h4 class="user-name">김민수 <span class="user-role">UI 디자이너</span></h4>
        </div>
      </div>
      <div class="testimonial-card">
        <img src="images/user2.png" class="user-avatar" alt="이지원 프로필">
        <div class="testimonial-content">
          <p class="testimonial-text">"심플하면서도 깊이 있는 디자인에 놀랐습니다. 코랄-레드 버튼의 클릭 반응성과 스파클 피드백이 아주 마음에 듭니다."</p>
          <h4 class="user-name">이지원 <span class="user-role">프리랜서 개발자</span></h4>
        </div>
      </div>
    </section>
  </main>

  <!-- App Footer (Gray theme) -->
  <footer class="app-footer">
    <p class="footer-text">© 2026 My Service</p>
  </footer>

  <!-- Interactive Script -->
  <script src="script.js"></script>
</body>

</html>
